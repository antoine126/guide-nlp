[project]
name = "guide-nlp"
version = "0.1.0"
description = "Companion code for 'Le Guide du NLP'"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antoine Pagneux" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "numpy>=2.5",
    "pandas>=3.1",
    "rich>=15",
]

# One group per family of tools (chapter 2). `uv sync --all-groups` installs
# everything; the three tools that conflict with this environment live in
# envs/ (ColPali needs torch < 2.14; PageIndex and docling pin an older
# huggingface-hub).
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "ty>=0.0.1"]
text = [
    "regex>=2026.9",
    "charset-normalizer>=3.5",
    "ftfy>=6.3",
    "nltk>=3.10",
    "spacy>=3.8.18,<3.9",
    "fr_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl",
    "fr_core_news_md @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl",
    "pysbd>=0.3.4",
    "simplemma>=1.1",
    "snowballstemmer>=3.1",
    "lingua-language-detector>=2.0",
    "datasketch>=1.6",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
web = [
    "httpx>=0.28",
    "tenacity>=9.2",
    "beautifulsoup4>=4.13",
    "lxml>=6.1",
    "selectolax>=0.3",
    "trafilatura>=2.0",
    "pdfplumber>=0.11",
    "pymupdf>=2.1",
    "python-docx>=1.1",
    "markitdown[docx]>=0.1",
    "scrapy>=2.13",
    "playwright>=1.50",
    "pyarrow>=26",
]
classic = [
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "gensim>=4.4",
    "bm25s>=0.3.16",
]
neural = [
    "torch>=2.15",
    "transformers>=5.22",
    "accelerate>=1.15",
    "datasets>=5.1",
    "tokenizers>=0.23",
    "sentencepiece>=0.2",
    "sentence-transformers>=6.2",
    "setfit>=1.2",
    "faiss-cpu>=1.15",
    "seqeval>=1.2",
    "sacrebleu>=2.6",
    "rouge-score>=0.1.2",
    "bertopic>=0.17",
    "umap-learn>=0.5",
    "hdbscan>=0.8.44",
    "pillow>=13",
]
llm = ["ollama>=0.6", "openai>=2.54", "anthropic>=0.122", "httpx>=0.28"]
rag = [
    "llama-index-core>=0.14.25",
    "llama-index-llms-ollama>=0.11",
    "llama-index-embeddings-huggingface>=0.8",
    "networkx>=3.7",
    "python-igraph>=1.0",
    "leidenalg>=0.12",
    "langgraph>=1.2",
    "mcp>=2.3",
]
audio = [
    "faster-whisper>=1.2",
    "jiwer>=4.0",
    "librosa>=1.0",
    "soundfile>=0.14",
    "piper-tts>=1.8",
]
serve = ["fastapi>=0.162", "uvicorn>=0.35"]

[tool.uv]
default-groups = ["dev", "text"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]

# Adapt the suffix (cu126, cu128, cu130, cu132...) to the CUDA version your
# driver supports (`nvidia-smi` shows it). The book's numbers were measured
# with torch 2.15.0+cu132.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guide_nlp"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["envs/*/.venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003: French text legitimately contains ’, « », non-breaking spaces.
# N803/N806: matrices keep their mathematical names (X, Q, K, V, W).
# E741: GloVe names its index tensors I and J, as in the paper.
# SIM905: the book writes short word lists as "a b c".split().
ignore = ["RUF001", "RUF002", "RUF003", "N803", "N806", "N812", "SIM905", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["guide_nlp"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "scripts", "tests"]

# Transformers 5 annotates from_pretrained() as possibly returning None and
# leaves the models' __call__ untyped: in the modules built on it, these three
# rules only report false positives.
[[tool.ty.overrides]]
include = [
    "src/guide_nlp/chapter2[3-7]/**",
    "src/guide_nlp/chapter31/**",
]

[tool.ty.overrides.rules]
call-non-callable = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
invalid-return-type = "ignore"
import-not-found = "ignore"

# These modules run in their own environment (envs/), not in this one.
[[tool.ty.overrides]]
include = [
    "src/guide_nlp/chapter08/docling_convert.py",
    "src/guide_nlp/chapter40/pageindex_local.py",
    "src/guide_nlp/chapter43/colqwen_search.py",
]

[tool.ty.overrides.rules]
import-not-found = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: downloads a model or trains one (deselect with -m 'not slow')",
    "ollama: needs a local Ollama server",
]
